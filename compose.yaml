services:
  cloud10:
    build: .
    image: cloud10-nas:0.3.0
    restart: unless-stopped
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "4173"
      DATABASE_PATH: /app/data/weather.sqlite
      NWAC_ENABLED: "false"
      TZ: America/Los_Angeles
    ports:
      - "${CLOUD10_BIND_ADDRESS:-127.0.0.1}:4173:4173"
    volumes:
      - weather-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpu_shares: 512
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  weather-data:
