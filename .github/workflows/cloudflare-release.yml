name: Release to Cloudflare
run-name: Release ${{ inputs.version || github.event.workflow_run.head_sha }} to Cloudflare
on:
  workflow_run:
    workflows: [Cloud10 CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Merged PR number (e.g. #42), release tag, or full main commit SHA'
        required: true
        type: string

permissions: {}

# Rollback can stop this particular run, including while it is still staging.
concurrency:
  group: cloud10-release-run-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  select:
    name: Resolve main build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      artifact_id: ${{ steps.pick.outputs.artifact_id }}
      digest: ${{ steps.pick.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        name: Resolve commit and verify successful main CI
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/cloudflare-production/candidate.py

  stage:
    name: Stage and verify ${{ needs.select.outputs.sha }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      deployment: false
    outputs:
      version: ${{ steps.upload.outputs.id }}
      url: ${{ steps.upload.outputs.url }}
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ needs.select.outputs.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --prefix deploy/cloudflare-production --no-audit --no-fund
      - name: Retrieve and verify the selected CI archive
        env:
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          DIGEST: ${{ needs.select.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/cloudflare-production/fetch-bundle.sh
      - name: Configure the selected Worker
        env:
          D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_ID"
          jq --arg db "$D1_ID" --arg sha "$RELEASE_SHA" --slurpfile runtime dist/cloudflare-production/runtime.json \
            '.d1_databases[0].database_id = $db | .vars.RELEASE = $sha |
             .compatibility_date = $runtime[0].compatibility_date | .compatibility_flags = $runtime[0].compatibility_flags' \
            deploy/cloudflare-production/wrangler.example.jsonc > deploy/cloudflare-production/wrangler.jsonc
      - name: Upload a version with no production traffic
        id: upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing production account ID}" "${CLOUDFLARE_API_TOKEN:?Missing production token}"
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/upload.jsonl"
          deploy/cloudflare-production/node_modules/.bin/wrangler versions upload --no-bundle --keep-vars \
            --config deploy/cloudflare-production/wrangler.jsonc --message "Git $RELEASE_SHA"
          python3 deploy/cloudflare-production/uploaded-version.py "$WRANGLER_OUTPUT_FILE_PATH"
      - name: Verify the version URL, assets and four live dashboards
        env:
          VERSION_URL: ${{ steps.upload.outputs.url }}
        run: |
          echo "::notice::Staging preview: $VERSION_URL/location/crystalmountain/snow-summary?lang=zh-CN"
          echo "[Preview Crystal Mountain in Chinese]($VERSION_URL/location/crystalmountain/snow-summary?lang=zh-CN)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Roll back this release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/cloudflare-rollback.yml) using run ID \`$GITHUB_RUN_ID\`." >> "$GITHUB_STEP_SUMMARY"
          python3 deploy/cloudflare-production/verify-live.py "$VERSION_URL" dist/cloudflare-production/manifest.json "$RUNNER_TEMP/verification.json" "$RELEASE_SHA"

  rollout:
    name: Roll out 10%, 50%, then 100%
    needs: [select, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://forecast.cloud10snow.com
    concurrency:
      group: cloud10-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ needs.select.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that an automatic release is still the main tip
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current" != "$RELEASE_SHA" ]]; then
              echo "A newer main commit superseded $RELEASE_SHA before rollout." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Retrieve the tested release manifest
        if: steps.eligible.outputs.ready == 'true'
        env:
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          DIGEST: ${{ needs.select.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/cloudflare-production/fetch-bundle.sh
      - name: Monitor the preview and live traffic for the 30-minute rollout
        if: steps.eligible.outputs.ready == 'true'
        env:
          VERSION_URL: ${{ needs.stage.outputs.url }}
          VERSION_ID: ${{ needs.stage.outputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deploy/cloudflare-production/rollout.py promote
