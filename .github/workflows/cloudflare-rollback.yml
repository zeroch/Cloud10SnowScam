name: Roll back production
run-name: Roll back Cloudflare release ${{ inputs.release_run_id || 'currently serving traffic' }}
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Optional release run ID. Leave blank for the current production rollout.'
        type: string
        required: false

permissions: {}

jobs:
  target:
    name: Identify the release to stop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          TARGET_RUN: ${{ inputs.release_run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deploy/cloudflare-production/rollout.py target

  stop:
    name: Stop that release before it advances
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cloud10-release-run-${{ needs.target.outputs.run_id }}
      cancel-in-progress: true
    steps:
      - run: echo 'The selected release no longer holds its concurrency group.'

  restore:
    name: Restore the previous production version
    needs: [target, stop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://forecast.cloud10snow.com
    concurrency:
      group: cloud10-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TARGET_RUN: ${{ needs.target.outputs.run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deploy/cloudflare-production/rollout.py rollback
