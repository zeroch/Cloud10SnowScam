name: Stage Cloudflare preview
run-name: Stage ${{ inputs.version || github.event.workflow_run.head_sha }} on Cloudflare
on:
  workflow_run:
    workflows: [Cloud10 CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Merged PR number (e.g. #42), release tag, or full main commit SHA'
        required: true
        type: string

permissions: {}

jobs:
  select:
    name: Resolve main build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      artifact_id: ${{ steps.pick.outputs.artifact_id }}
      digest: ${{ steps.pick.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        name: Resolve commit and verify successful main CI
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/cloudflare-production/candidate.py

  stage:
    name: Stage and verify ${{ needs.select.outputs.sha }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only one upload at a time may move the shared staging bookmark.
    concurrency:
      group: cloud10-staging
      queue: max
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ needs.select.outputs.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --prefix deploy/cloudflare-production --no-audit --no-fund
      - name: Retrieve and verify the selected CI archive
        env:
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          DIGEST: ${{ needs.select.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/cloudflare-production/fetch-bundle.sh
      - name: Configure the selected Worker
        env:
          D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_ID"
          jq --arg db "$D1_ID" --arg sha "$RELEASE_SHA" --slurpfile runtime dist/cloudflare-production/runtime.json \
            '.d1_databases[0].database_id = $db | .vars.RELEASE = $sha |
             .compatibility_date = $runtime[0].compatibility_date | .compatibility_flags = $runtime[0].compatibility_flags' \
            deploy/cloudflare-production/wrangler.example.jsonc > deploy/cloudflare-production/wrangler.jsonc
      - name: Find the latest successful main build
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloud10-ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "No successful main build found." >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Upload a version with no production traffic
        id: upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_STAGING: ${{ steps.latest.outputs.sha == env.RELEASE_SHA }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing production account ID}" "${CLOUDFLARE_API_TOKEN:?Missing production token}"
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/upload.jsonl"
          alias_args=()
          if [[ "$PUBLISH_STAGING" == true ]]; then alias_args=(--preview-alias staging); fi
          deploy/cloudflare-production/node_modules/.bin/wrangler versions upload --no-bundle --keep-vars \
            --config deploy/cloudflare-production/wrangler.jsonc --message "Git $RELEASE_SHA" "${alias_args[@]}"
          python3 deploy/cloudflare-production/uploaded-version.py "$WRANGLER_OUTPUT_FILE_PATH"
      - name: Verify the version URL, assets and four live dashboards
        env:
          VERSION_URL: ${{ steps.upload.outputs.url }}
        run: |
          echo "::notice::Staging preview: $VERSION_URL/location/crystalmountain/snow-summary?lang=zh-CN"
          echo "[Preview Crystal Mountain in Chinese]($VERSION_URL/location/crystalmountain/snow-summary?lang=zh-CN)" >> "$GITHUB_STEP_SUMMARY"
          python3 deploy/cloudflare-production/verify-live.py "$VERSION_URL" dist/cloudflare-production/manifest.json "$RUNNER_TEMP/verification.json" "$RELEASE_SHA"
      - name: Verify the staging bookmark serves this build
        if: steps.upload.outputs.staging_url != ''
        working-directory: deploy/cloudflare-production
        env:
          STAGING_URL: ${{ steps.upload.outputs.staging_url }}
        run: |
          python3 - <<'PY'
          import os
          from rollout import check_health, retry
          retry(lambda: check_health(os.environ['STAGING_URL'], os.environ['RELEASE_SHA']), attempts=8, delay=5)
          PY
          echo "[Latest staging build]($STAGING_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Link the manual production procedure
        run: |
          echo "Staging checks passed. [Switch production traffic manually]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/deployment/cloudflare-production.md#switch-production-traffic-manually)." >> "$GITHUB_STEP_SUMMARY"
