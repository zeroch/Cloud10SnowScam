name: Cloud10 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Cloud10 CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --prefix deploy/cloudflare-production --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest discover -s deploy/cloudflare-production/tests
      - name: Build and verify the Worker, D1 handoff and static assets
        run: bash deploy/cloudflare-production/build-release.sh
      - name: Store this main build for manual release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud10-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/cloudflare-production/
          if-no-files-found: error
          retention-days: 90
